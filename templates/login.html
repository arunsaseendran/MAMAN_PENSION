<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Pensionary Benefits Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f2545;
      --navy-mid: #1b3a6b;
      --blue: #1d4ed8;
      --blue-soft: #eff4ff;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --white: #ffffff;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-lg: 0 12px 40px rgba(15, 37, 69, 0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #eef2f7 0%, #f7f9fc 100%);
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      background: var(--navy);
      padding: 32px 28px 26px;
      text-align: center;
      color: #fff;
    }

    .emblem-icon {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .emblem-icon svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .welcome-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #93c5fd;
      margin-top: 8px;
    }

    .login-body {
      padding: 28px 28px 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      width: 100%;
      padding: 11px 42px 11px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--gray-900);
      background: var(--white);
      transition: all 0.2s ease;
      outline: none;
    }

    .password-wrap input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-pwd:hover {
      color: var(--gray-700);
    }

    .toggle-pwd svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .error-msg {
      background: var(--red-soft);
      border: 1px solid #fecaca;
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-login:hover {
      background: var(--navy-mid);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 37, 69, 0.2);
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--gray-400);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="emblem-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 22V10l9-7 9 7v12H3zm4-2h3v-5h4v5h3v-9.5l-5-3.9-5 3.9V20z" />
        </svg>
      </div>
      <h1>Pensionary Benefits Portal</h1>
      <div class="welcome-text">Welcome Mr T.E Janardhanan</div>
    </div>

    <div class="login-body">
      {% if error %}
      <div class="error-msg">
        <svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label class="form-label" for="password">Enter Portal Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••••••" autofocus required autocomplete="current-password"/>
            <button type="button" class="toggle-pwd" onclick="toggleVisibility()" title="Show/Hide Password">
              <svg id="eyeIcon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Sign In &rarr;</button>
      </form>

      <div class="footer-note">
        Protected System &bull; Authorized Access Only
      </div>
    </div>
  </div>

  <script>
    function toggleVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
